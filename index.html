<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0010;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    canvas#fireworks {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    #stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      opacity: var(--op);
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--op); transform: scale(1); }
      50% { opacity: 0.1; transform: scale(0.5); }
    }

    #petals-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .petal {
      position: absolute;
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation: fall-petal linear infinite;
    }

    @keyframes fall-petal {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    #heart-scene {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    #heart-svg {
      filter: drop-shadow(0 0 30px #ff3388) drop-shadow(0 0 60px #ff0055);
      animation: heartbeat 1.4s ease-in-out infinite, float 3s ease-in-out infinite;
      cursor: pointer;
      transition: filter 0.3s;
    }

    #heart-svg:hover {
      filter: drop-shadow(0 0 50px #ff3388) drop-shadow(0 0 90px #ff0055) drop-shadow(0 0 15px #ffaacc);
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.08); }
      28% { transform: scale(1); }
      42% { transform: scale(1.05); }
      70% { transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { margin-top: 0px; }
      50% { margin-top: -14px; }
    }

    #title-text {
      font-size: 13px;
      letter-spacing: 4px;
      color: #ff99cc;
      text-transform: uppercase;
      margin: 24px 0 10px;
      opacity: 0.8;
    }

    /* ✏️ CAMBIA "TU NOMBRE AQUÍ" por el nombre de tu enamorada */
    #name-text {
      font-size: 42px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 18px;
      animation: glow-name 2s ease-in-out infinite alternate;
    }

    @keyframes glow-name {
      from { text-shadow: 0 0 10px #ff3388, 0 0 20px #ff0055; }
      to   { text-shadow: 0 0 30px #ff88bb, 0 0 60px #ff3388, 0 0 80px #ff0055; }
    }

    /* ✏️ CAMBIA el mensaje por tu propia dedicatoria */
    #message-text {
      font-size: 16px;
      color: #ffccdd;
      max-width: 420px;
      line-height: 1.9;
      font-style: italic;
      text-shadow: 0 0 10px rgba(255,100,150,0.4);
      margin-bottom: 22px;
    }

    #click-hint {
      font-size: 11px;
      color: #ff99cc;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse-hint 2s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes pulse-hint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* Botón Continuar */
    #btn-continuar {
      padding: 14px 48px;
      font-size: 15px;
      font-family: 'Georgia', serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 1.5px solid #ff3388;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(255,51,136,0.3), inset 0 0 20px rgba(255,51,136,0.05);
      animation: pulse-btn 2.5s ease-in-out infinite;
    }

    #btn-continuar:hover {
      background: rgba(255,51,136,0.15);
      box-shadow: 0 0 40px rgba(255,51,136,0.6), inset 0 0 30px rgba(255,51,136,0.1);
      transform: scale(1.05);
    }

    @keyframes pulse-btn {
      0%, 100% { box-shadow: 0 0 20px rgba(255,51,136,0.3), inset 0 0 20px rgba(255,51,136,0.05); }
      50% { box-shadow: 0 0 40px rgba(255,51,136,0.6), inset 0 0 30px rgba(255,51,136,0.1); }
    }

    /* Modal de contraseña */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    #modal-overlay.show {
      display: flex;
      animation: fade-in 0.4s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    #modal-box {
      background: linear-gradient(135deg, #1a0030, #0d0020);
      border: 1px solid rgba(255,51,136,0.4);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 60px rgba(255,51,136,0.3), 0 0 120px rgba(255,0,85,0.15);
      animation: slide-up 0.4s ease;
    }

    @keyframes slide-up {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    #modal-lock {
      font-size: 48px;
      margin-bottom: 16px;
      animation: swing 2s ease-in-out infinite;
    }

    @keyframes swing {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate(8deg); }
    }

    #modal-title {
      font-size: 13px;
      letter-spacing: 4px;
      color: #ff99cc;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    #password-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,51,136,0.4);
      border-radius: 50px;
      color: #fff;
      font-size: 18px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }

    #password-input:focus {
      border-color: #ff3388;
      box-shadow: 0 0 20px rgba(255,51,136,0.4);
      background: rgba(255,51,136,0.05);
    }

    #btn-entrar {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ff0055, #cc0044);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(255,0,85,0.4);
    }

    #btn-entrar:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 35px rgba(255,0,85,0.7);
    }

    #error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #ff6688;
      min-height: 20px;
      animation: shake 0.4s ease;
      letter-spacing: 1px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    #btn-cerrar-modal {
      margin-top: 14px;
      background: none;
      border: none;
      color: rgba(255,153,204,0.5);
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    #btn-cerrar-modal:hover { color: #ff99cc; }
  </style>
</head>
<body>

  <canvas id="fireworks"></canvas>
  <div id="stars"></div>
  <div id="petals-container"></div>

  <div id="heart-scene">
    <svg id="heart-svg" width="220" height="200" viewBox="0 0 200 180"
         xmlns="http://www.w3.org/2000/svg" onclick="bigBang()">
      <defs>
        <radialGradient id="hg" cx="40%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#ff99cc"/>
          <stop offset="40%" stop-color="#ff2266"/>
          <stop offset="100%" stop-color="#880022"/>
        </radialGradient>
        <radialGradient id="hg2" cx="60%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#ffccdd" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#ff2266" stop-opacity="0"/>
        </radialGradient>
        <filter id="blur-glow">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M100 160 C60 130, 10 100, 10 60 C10 30, 35 10, 60 10 C75 10, 90 18, 100 30 C110 18, 125 10, 140 10 C165 10, 190 30, 190 60 C190 100, 140 130, 100 160Z"
            fill="url(#hg)" filter="url(#blur-glow)"/>
      <path d="M100 160 C60 130, 10 100, 10 60 C10 30, 35 10, 60 10 C75 10, 90 18, 100 30 C110 18, 125 10, 140 10 C165 10, 190 30, 190 60 C190 100, 140 130, 100 160Z"
            fill="url(#hg2)"/>
      <path d="M55 35 C50 45, 55 60, 65 70" stroke="#ffddee" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M70 25 C67 32, 70 42, 76 48" stroke="#ffddee" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    </svg>

    <div id="title-text">❤ con todo mi amor ❤</div>

    <!-- ✏️ CAMBIA "TU NOMBRE AQUÍ" por el nombre de tu enamorada -->
    <div id="name-text">Karencita</div>

    <!-- ✏️ CAMBIA el mensaje -->
    <div id="message-text">
      "Cada día a tu lado es el mejor día de mi vida.<br>
      Eres mi razón, mi luz y mi todo."
    </div>

    <div id="click-hint">✦ toca el corazón para fuegos artificiales ✦</div>

    <button id="btn-continuar" onclick="abrirModal()">Continuar</button>
  </div>

  <!-- Modal contraseña -->
  <div id="modal-overlay">
    <div id="modal-box">
      <div id="modal-lock">🔐</div>
      <div id="modal-title">Ingresa la contraseña</div>
      <input type="password" id="password-input" placeholder="••••••"
             onkeydown="if(event.key==='Enter') verificar()"/>
      <button id="btn-entrar" onclick="verificar()">Entrar</button>
      <div id="error-msg"></div>
      <button id="btn-cerrar-modal" onclick="cerrarModal()">← volver</button>
    </div>
  </div>

  <script>
    // ============================================================
    // ✏️ CAMBIA LA CONTRASEÑA AQUÍ (entre las comillas)
    const CONTRASENA = "Karencita16";
    // ============================================================

    // Estrellas
    const starsDiv = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2;
      s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--dur:${1.5+Math.random()*3}s;--op:${0.3+Math.random()*0.7};animation-delay:${Math.random()*3}s`;
      starsDiv.appendChild(s);
    }

    // Pétalos
    const petalsDiv = document.getElementById('petals-container');
    const petalColors = ['#ff3399','#ff66aa','#ff99cc','#ffccdd','#ff0055','#cc0044'];
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 6 + Math.random() * 9;
      p.style.cssText = `left:${Math.random()*100}%;top:-10px;background:${petalColors[Math.floor(Math.random()*petalColors.length)]};width:${size}px;height:${size}px;animation-duration:${4+Math.random()*7}s;animation-delay:${Math.random()*10}s`;
      petalsDiv.appendChild(p);
    }

    // Fuegos artificiales
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const fireworks = [], particles = [];

    class Rocket {
      constructor(fromX, fromY) {
        this.x = fromX ?? Math.random() * W;
        this.y = fromY ?? H;
        this.tx = 80 + Math.random() * (W - 160);
        this.ty = 60 + Math.random() * (H * 0.45);
        const angle = Math.atan2(this.ty - this.y, this.tx - this.x);
        const spd = 7 + Math.random() * 5;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd;
        this.trail = [];
        this.alive = true;
        this.color = `hsl(${Math.random()*60+320},100%,70%)`;
      }
      update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 14) this.trail.shift();
        this.x += this.vx; this.y += this.vy;
        if (Math.hypot(this.tx - this.x, this.ty - this.y) < 8) {
          this.alive = false; explode(this.x, this.y, this.color);
        }
      }
      draw() {
        this.trail.forEach((pt, i) => {
          const a = i / this.trail.length;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, 2*a, 0, Math.PI*2);
          ctx.fillStyle = this.color; ctx.globalAlpha = a*0.9; ctx.fill();
        });
        ctx.globalAlpha = 1;
      }
    }

    function explode(x, y, color) {
      const count = 90 + Math.floor(Math.random() * 70);
      const isHeart = Math.random() < 0.4;
      for (let i = 0; i < count; i++) {
        let vx, vy;
        if (isHeart) {
          const t = (i/count)*Math.PI*2;
          const hx = 16*Math.pow(Math.sin(t),3);
          const hy = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
          const spd = 1.8+Math.random()*0.8;
          vx = (hx/16)*spd*4; vy = (hy/16)*spd*4;
        } else {
          const angle = (i/count)*Math.PI*2;
          const spd = 1+Math.random()*6;
          vx = Math.cos(angle)*spd; vy = Math.sin(angle)*spd;
        }
        particles.push({ x, y, vx, vy, alpha:1, decay:0.011+Math.random()*0.014,
          size:1.5+Math.random()*2,
          color: isHeart ? `hsl(${340+Math.random()*30},100%,${60+Math.random()*20}%)` : `hsl(${Math.random()*360},100%,70%)`,
          gravity:0.045, friction:0.97 });
      }
    }

    let autoTimer = 0;
    function loop() {
      ctx.fillStyle = 'rgba(10,0,16,0.18)';
      ctx.fillRect(0,0,W,H);
      autoTimer++;
      if (autoTimer > 60) { fireworks.push(new Rocket()); autoTimer = 0; }
      fireworks.forEach(fw => { fw.update(); fw.draw(); });
      for (let i = fireworks.length-1; i>=0; i--) if (!fireworks[i].alive) fireworks.splice(i,1);
      for (let i = particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.vx *= p.friction; p.vy *= p.friction; p.vy += p.gravity;
        p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
        if (p.alpha <= 0) { particles.splice(i,1); continue; }
        ctx.globalAlpha = p.alpha;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = p.color; ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(loop);
    }

    window.bigBang = function() {
      for (let i = 0; i < 7; i++)
        setTimeout(() => fireworks.push(new Rocket(W/2+(Math.random()-0.5)*120, H)), i*100);
    };

    // Modal
    window.abrirModal = function() {
      document.getElementById('modal-overlay').classList.add('show');
      setTimeout(() => document.getElementById('password-input').focus(), 400);
    };
    window.cerrarModal = function() {
      document.getElementById('modal-overlay').classList.remove('show');
      document.getElementById('password-input').value = '';
      document.getElementById('error-msg').textContent = '';
    };
    window.verificar = function() {
      const val = document.getElementById('password-input').value;
      const err = document.getElementById('error-msg');
      if (val === CONTRASENA) {
        err.style.color = '#88ffcc';
        err.textContent = '✓ Acceso concedido ❤';
        setTimeout(() => {
          // ✏️ Cambia "pagina2.html" si renombraste el archivo
          window.location.href = 'pagina2.html';
        }, 800);
      } else {
        err.style.color = '#ff6688';
        err.textContent = '✗ Contraseña incorrecta, inténtalo de nuevo';
        err.style.animation = 'none';
        void err.offsetWidth;
        err.style.animation = 'shake 0.4s ease';
        document.getElementById('password-input').value = '';
        document.getElementById('password-input').focus();
      }
    };

    loop();
  </script>
</body>
</html>
